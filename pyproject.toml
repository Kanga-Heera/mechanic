[project]
name = "mechanic"
version = "0.1.0"
description = "Detection-rule maintenance triage: fault-isolated Sigma/Elastic/Splunk loading, git-driven behavioral staleness, an STP-validated structural fragility classifier, and an explainable review-priority triage on top."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "pydriller>=2.6",
    "pysigma>=1.5.0",
    "click>=8.1",
    "rich>=13.0",
    "rich-click>=1.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# scipy/numpy are needed only by tests/test_validated_numbers_lock.py (the
# STP rank-correlation regression lock, Part 4 of the core hardening pass)
# - test tooling, not a runtime dependency of the core or the experiment.
# That one test module skips itself (pytest.importorskip) if they're absent.
dev = [
    "pytest>=7.0",
    "scipy>=1.11",
    "numpy>=1.26",
    # for tests/test_gui.py (FastAPI's TestClient) - the GUI's own runtime
    # dependency is the separate `gui` extra below; this is test tooling.
    "httpx>=0.27",
]
# Stage 3 EXPERIMENT only (repair-verification harness + LLM repair
# generator) - see docs/core-vs-experiment.md. The core product
# (scan/staleness/triage/explain) does not need requests and has no network
# dependency at all; only mechanic-repair (mechanic/cli_repair.py) and the
# mechanic.llm_client/verify/gate/evasion/repair_generator/repair_outcome/
# synthetic_benign modules use this.
repair = ["requests>=2.31"]
# Local GUI (`mechanic gui`) - a VIEW over the core engine only, never the
# repair experiment. Runs fully offline (no CDN assets, no network calls
# from the served page). `mechanic/cli.py` imports mechanic.gui lazily
# (inside the `gui` command body), so these are never required just to run
# scan/staleness/triage/explain.
gui = ["fastapi>=0.110", "uvicorn>=0.29"]

[project.scripts]
mechanic = "mechanic.cli:main"
mechanic-repair = "mechanic.cli_repair:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mechanic*"]

[tool.setuptools.package-data]
mechanic = ["data/*.json", "data/*.md", "gui/static/*"]
