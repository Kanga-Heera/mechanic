[project]
name = "mechanic"
version = "0.1.0"
description = "Sigma detection-rule maintenance triage: fault-isolated rule loading, git-driven behavioral staleness (format-agnostic, also Elastic/Splunk), an STP-validated structural fragility classifier, and an explainable review-priority triage on top."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "pydriller>=2.6",
    "pysigma>=1.5.0",
    "click>=8.1",
    "rich>=13.0",
    "rich-click>=1.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# scipy/numpy are needed only by tests/test_validated_numbers_lock.py (the
# STP rank-correlation regression lock, Part 4 of the core hardening pass)
# - test tooling, not a runtime dependency of the core or the experiment.
# That one test module skips itself (pytest.importorskip) if they're absent.
dev = [
    "pytest>=7.0",
    "scipy>=1.11",
    "numpy>=1.26",
    # for tests/test_gui.py (FastAPI's TestClient) - the GUI's own runtime
    # dependency is the separate `gui` extra below; this is test tooling.
    "httpx>=0.27",
]
# Local GUI (`mechanic gui`) - a VIEW over the core engine only. Runs fully
# offline (no CDN assets, no network calls from the served page).
# `mechanic/cli.py` imports mechanic.gui lazily (inside the `gui` command
# body), so these are never required just to run scan/staleness/triage/explain.
gui = ["fastapi>=0.110", "uvicorn>=0.29"]

[project.scripts]
mechanic = "mechanic.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mechanic*"]

[tool.setuptools.package-data]
mechanic = ["data/*.json", "data/*.md", "gui/static/*"]
